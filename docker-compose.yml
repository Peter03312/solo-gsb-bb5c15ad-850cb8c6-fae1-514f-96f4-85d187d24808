services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    volumes:
      - trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 应用启动时自动建库建表；可用环境变量覆盖（见 README）
      TRACE_DATABASE_URL: postgresql+psycopg2://trace:trace@db:5432/trace
      TRACE_HOST: 0.0.0.0
      TRACE_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  trace_pgdata:
